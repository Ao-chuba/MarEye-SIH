services:
  - type: web
    name: mareye-marine-security
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_BASE_URL
        value: "https://your-render-app-url.onrender.com" # Replace with your actual Render URL
    healthCheckPath: /api/health
    autoDeploy: true
    branch: enchance
    # Additional configuration for better deployment
    dockerfilePath: ./Dockerfile
    # Render will automatically set PORT environment variable
